name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$packageVersion"
          }

      - name: Build Windows release
        run: npm run build && npx electron-builder --win nsis --publish never

      - name: Publish release assets
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = node -p "require('./package.json').version"

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Focus Calendar $version" --generate-notes
          }

          $assetPaths = @(
            (Resolve-Path "release-build/FocusCalendar-Setup-$version.exe").Path
            (Resolve-Path "release-build/FocusCalendar-Setup-$version.exe.blockmap").Path
            (Resolve-Path "release-build/latest.yml").Path
          )
          & gh release upload $tag @assetPaths --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
